# .github/workflows/ci.yml
#
# Continuous integration for Portcullis.
#
# Runs on every push to main and every pull request. The job is a single
# Go test invocation against the standard ubuntu-latest runner, which has
# Docker preinstalled — testcontainers spawns Postgres and Redis from this
# Docker daemon, same as your local dev setup.
#
# What this catches:
#   - Compilation errors on a clean machine (no leftover build cache)
#   - Test failures, including races (-race detector enabled)
#   - Unformatted code (gofmt)
#   - Common bugs caught by go vet
#
# What this does NOT catch (yet):
#   - golangci-lint and friends (P4.6)
#   - Docker image build (P4.6)
#   - Cross-platform issues (only Linux runners)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new push lands on the same ref.
# Saves Actions minutes; you almost never care about old runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    # 15-minute ceiling. Testcontainer boot + race-detector test suite
    # should run in ~5 minutes; if it hits 15 something is stuck.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check gofmt
        # `gofmt -l` prints names of unformatted files. If any are found,
        # this step fails. The `! grep` trick: empty input -> exit 1.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files (run 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # -race enables the race detector. -count=1 disables the test
        # cache (which would skip tests that already passed); we want a
        # cold run in CI to catch issues that depend on test ordering.
        run: go test -race -count=1 -timeout=10m ./...
