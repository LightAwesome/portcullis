# .github/workflows/ci.yml
#
# Continuous integration for Portcullis.
#
# Runs on every push to main and every pull request. The job runs the
# standard quality gates (gofmt, vet, lint, test) plus a Docker image
# build to catch Dockerfile regressions.
#
# What this catches:
#   - Compilation errors on a clean machine
#   - Unformatted code (gofmt)
#   - Common bugs caught by go vet
#   - Issues flagged by golangci-lint's standard preset
#   - Test failures, including races (-race)
#   - Dockerfile that no longer builds
#
# What this does NOT catch (yet):
#   - Pushing the built image to a registry (P4.7 deploy work)
#   - Cross-platform issues (Linux runners only)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files (run 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: go test
        run: go test -race -count=1 -timeout=10m ./...

      - name: Build Docker image
        # Build but don't push. Catches Dockerfile regressions before
        # they bite at deploy time. Tagged :ci so it doesn't clobber a
        # local :dev image if anyone ever inspects the runner.
        run: docker build -t portcullis:ci .
