# golangci-lint configuration for Portcullis.
#
# Pinned to v2.12.x via the GitHub Actions workflow. To run locally:
#   golangci-lint run ./...
#
# Philosophy: enable the linters that catch real bugs (errcheck,
# ineffassign, staticcheck, govet, gosimple) and skip the opinionated
# style nags. For a single-developer project, lint that argues with
# you is lint that gets disabled — better to start narrow and add
# linters when there's a specific pain point to address.
#
# Schema reference: https://golangci-lint.run/docs/configuration/file/
# Migration guide:  https://golangci-lint.run/docs/product/migration-guide/

version: "2"

run:
  # Match the Go version specified in go.mod. Explicit declaration
  # avoids version-mismatch warnings.
  go: "1.26.3"

linters:
  # `default: standard` enables the v2 standard preset (errcheck,
  # govet, ineffassign, staticcheck, unused). Real-bug linters,
  # not style nags.
  default: standard

  # Per-linter exclusions go here when needed. Empty for now.
  # Example shape (commented):
  #
  #   exclusions:
  #     rules:
  #       - linters:
  #           - errcheck
  #         path: _test\.go
  #         text: "Encode"
  #
  # Add such blocks only when CI surfaces a false positive worth
  # silencing rather than fixing.
