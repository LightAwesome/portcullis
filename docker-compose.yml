name: portcullis

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: portcullis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portcullis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: portcullis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portcullis -d portcullis"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - portcullis-net

  redis:
    image: redis:7.4-alpine
    container_name: portcullis-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - portcullis-net

  # The gateway itself. Profile-gated: `docker compose up` (no profile)
  # brings up only the data services so `make dev` can run on the host;
  # `docker compose --profile full up` brings up everything in containers,
  # which is what the VPS will do.
  gateway:
    image: portcullis:dev
    container_name: portcullis-gateway
    restart: unless-stopped
    profiles:
      - full
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORTCULLIS_ENV: ${PORTCULLIS_ENV:-development}
      PORTCULLIS_ADDR: ":8080"
      PORTCULLIS_LOG_LEVEL: ${PORTCULLIS_LOG_LEVEL:-info}
      # Service-name DNS works because we share the portcullis-net bridge.
      # The credentials match the postgres service's env block.
      PORTCULLIS_DATABASE_URL: "postgres://portcullis:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/portcullis?sslmode=disable"
      PORTCULLIS_REDIS_URL: "redis://redis:6379"
      PORTCULLIS_ADMIN_KEY: ${PORTCULLIS_ADMIN_KEY:?PORTCULLIS_ADMIN_KEY must be set}
      PORTCULLIS_KEY_PEPPER: ${PORTCULLIS_KEY_PEPPER:?PORTCULLIS_KEY_PEPPER must be set}
      PORTCULLIS_MASTER_KEY: ${PORTCULLIS_MASTER_KEY:?PORTCULLIS_MASTER_KEY must be set}
      PORTCULLIS_DEFAULT_MAX_REQUESTS: ${PORTCULLIS_DEFAULT_MAX_REQUESTS:-60}
      PORTCULLIS_DEFAULT_WINDOW_SECONDS: ${PORTCULLIS_DEFAULT_WINDOW_SECONDS:-60}
      PORTCULLIS_DASHBOARD_TOKEN: ${PORTCULLIS_DASHBOARD_TOKEN:?PORTCULLIS_DASHBOARD_TOKEN must be set}
      PORTCULLIS_ALLOWED_ORIGINS: ${PORTCULLIS_ALLOWED_ORIGINS:?PORTCULLIS_ALLOWED_ORIGINS must be set}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portcullis-net
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: portcullis-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portcullis-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: portcullis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - portcullis-net

volumes:
  pgdata:
  redisdata:
  prometheus_data:
  grafana_data:

networks:
  portcullis-net:
    driver: bridge
